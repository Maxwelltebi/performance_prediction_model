[project]
name = "student-performance-predictor"
version = "1.0.0"
description = "FastAPI student grade predictor with a bundled Random Forest model"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.13.5",
    "scikit-learn==1.6.1",
    "numpy==2.2.6",
    "pandas==2.2.3",
    "scipy==1.15.3",
    "joblib==1.4.2",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "server:app"

[tool.vercel.scripts]
build = "python scripts/build_vercel.py"
